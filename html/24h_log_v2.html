<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; media-src data:">

<meta name="theme-color" content="#070a1f">
<title>24時間ログ — 動く紙芝居</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#05071a;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Noto Sans CJK JP","Yu Gothic",Meiryo,sans-serif;-webkit-font-smoothing:antialiased;touch-action:manipulation}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ui{position:fixed;z-index:5;top:calc(env(safe-area-inset-top,0px) + 8px);height:36px;min-width:36px;padding:0 13px;font-weight:600;font-size:13px;line-height:34px;font-family:inherit;color:#fff;letter-spacing:.04em;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.07));border:1px solid rgba(255,255,255,.4);border-radius:999px;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 0 14px rgba(255,90,200,.25),inset 0 1px 0 rgba(255,255,255,.35);-webkit-tap-highlight-color:transparent;opacity:0;pointer-events:none;transition:opacity .5s}
.ui.show{opacity:1;pointer-events:auto}
.ui:active{transform:scale(.96)}
#mute{right:8px}
#replay{right:calc(8px + var(--mw,104px) + 8px)}
#gate{position:fixed;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;background:radial-gradient(ellipse at 50% 40%,rgba(30,26,80,.55),rgba(3,4,16,.88));transition:opacity .8s}
#gate.hide{opacity:0;pointer-events:none}
#gate .tt{font-weight:800;font-size:clamp(34px,9vw,56px);letter-spacing:.14em;color:#fff;text-shadow:2px 2px 0 rgba(255,60,170,.8),-1.5px 0 0 rgba(80,230,255,.7),0 0 28px rgba(160,150,255,.6)}
#gate .st{margin-top:10px;font-size:14px;letter-spacing:.2em;color:#d9d6ff}
#gate .rc{margin-top:16px;font:600 13px ui-monospace,Menlo,Consolas,monospace;color:#ff8ad0;letter-spacing:.08em}
#gate .bs{margin-top:34px;display:flex;flex-direction:column;gap:14px;width:min(320px,86vw)}
.gb{font-weight:700;font-size:16px;line-height:1;font-family:inherit;padding:17px 18px;border-radius:999px;color:#fff;cursor:pointer;border:1px solid rgba(255,255,255,.45);background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,.07));box-shadow:0 0 26px rgba(255,80,200,.35),inset 0 1px 0 rgba(255,255,255,.45);-webkit-tap-highlight-color:transparent;letter-spacing:.06em}
.gb.p{background:linear-gradient(180deg,rgba(255,120,210,.65),rgba(150,90,255,.45));animation:br 2.4s ease-in-out infinite}
.gb.s{font-size:14px;padding:13px 18px;font-weight:600}
@keyframes br{50%{box-shadow:0 0 44px rgba(255,80,200,.7),inset 0 1px 0 rgba(255,255,255,.45)}}
#gate .nt{margin-top:22px;font-size:12px;color:#b9b6e6;line-height:1.7}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="sr" id="live" aria-live="polite"></div>
<button class="ui" id="replay" aria-label="最初から再生">↻ リプレイ</button>
<button class="ui" id="mute" aria-label="サウンド切り替え">♪ 音あり</button>
<div id="gate">
  <div class="tt">24時間ログ</div>
  <div class="st">動く紙芝居</div>
  <div class="rc">● REC 2s × 24</div>
  <div class="bs">
    <button class="gb p" id="goSound">タップして再生 (音あり)</button>
    <button class="gb s" id="goMute">音なしで再生</button>
  </div>
  <div class="nt">約1分半 ・ 画面を縦にするのがおすすめ<br>2周目は、ちょっとちがう「新しい世界」</div>
</div>
<script>
(function(){
"use strict";
var DA=94.5, DB=80, CARDLEN=3.6, DUR=DA, SW=360, SH=640;
var VAR=0, PASSN=0, TL=0, CARDPH=0, LOC=0;
var cv=document.getElementById('c'), ctx=cv.getContext('2d'), g=ctx;
var W=0,H=0,dpr=1,S=1,OX=0,OY=0,X0=0,X1=SW,Y0=0,Y1=SH,GY=SH;
var params=new URLSearchParams(location.search);
var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
var SANS='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP","Yu Gothic",Meiryo,-apple-system,BlinkMacSystemFont,sans-serif';
var MONO='ui-monospace,"SF Mono","Noto Sans Mono CJK JP",Menlo,Consolas,monospace';

/* ---------- utils ---------- */
function clamp(x,a,b){return x<a?a:x>b?b:x}
function lerp(a,b,t){return a+(b-a)*t}
function seg(t,a,b){return clamp((t-a)/(b-a),0,1)}
function eio(x){return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2}
function eout(x){return 1-Math.pow(1-x,3)}
function ein(x){return x*x*x}
function eoutBack(x){var c1=1.2,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)}
function rng(seed){return function(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}}
function mix(a,b,t){return [lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)]}
function rgb(c,a){return 'rgba('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+','+(a==null?1:a)+')'}

/* ---------- timeline data (the single source of truth) ---------- */
var BLK=[{h:1,s:0,t:11},{h:2,s:1,t:14.5},{h:3,s:2,t:18},{h:4,s:3,t:21.5},{h:5,s:4,t:25},{h:6,s:5,t:28.5},{h:11,s:6,t:32},{h:12,s:7,t:35.5}];
var LIVE=[{h:15,s:8},{h:18,s:9},{h:22,s:10}];
var HOURT=[0,11,14.5,18,21.5,25,28.5,30.9,31.2,31.5,31.8,32,35.5];
for(var hh=13;hh<=24;hh++)HOURT[hh]=52+2*(hh-13);
var SCN=['朝の寝ぐせ','母のおにぎり','駅のホームの足元','自販機の缶コーヒー','犬の散歩','ラーメンの湯気','部活帰りのコンビニ','屋上の夕焼け','夜の自転車','無言で並ぶ二人','窓の灯り','土から芽が出た','傘を半分こ','夜の窓の灯り','星を見上げる子','猫のあくび','雨上がりの水たまり','席をゆずる','手を振る','朝のパン屋','ブランコ','洗濯物の風'];
var CARD={x:30,y:204,w:300,h:225};
var MEL=[1046.5,1318.5,1568,1760,1568,1318.5,1174.7,1318.5,1568,1760,2349.3,2093]; // hours 13..24
function hourAt(t){var h=0;for(var i=1;i<=24;i++)if(HOURT[i]<=t)h=i;return h}

/* pass B (2nd loop): local body time tl -> story time ta. Same drawing code, gaps trimmed (clips stay 1:1). */
var BWP=[[0,0],[11,11]];
(function(){var tl=11,gaps=[.2,.2,.2,.2,.2,.7,.2,.2];
  for(var i=0;i<8;i++){var a0=BLK[i].t;BWP.push([tl,a0]);BWP.push([tl+2.6,a0+2.6]);tl+=2.6+gaps[i]}
  tl+=-gaps[7]+.2;BWP.push([tl,39]);tl+=13/1.6;BWP.push([tl,52]);tl+=22/1.15;BWP.push([tl,74]);tl+=7;BWP.push([tl,81]);tl+=13.5/1.15;BWP.push([tl,94.5]);DB=tl})();
function taOf(tl){if(tl<=0)return tl;for(var i=1;i<BWP.length;i++)if(tl<=BWP[i][0]){var a=BWP[i-1],b=BWP[i];return a[1]+(b[1]-a[1])*(tl-a[0])/(b[0]-a[0])}return 94.5}
function tlOf(ta){if(ta<=0)return ta;for(var i=1;i<BWP.length;i++)if(ta<=BWP[i][1]){var a=BWP[i-1],b=BWP[i];return a[0]+(b[0]-a[0])*(ta-a[1])/(b[1]-a[1])}return DB}
/* pass layout: p0 = A (no card). odd p = card + B. even p>=2 = card + A again. */
function plen(p){return p==0?DA:CARDLEN+(p%2==1?DB:DA)}
function pstart(p){if(p<=0)return 0;var c=plen(1)+plen(2),k=Math.floor((p-1)/2),s=DA+k*c;if((p-1)%2==1)s+=plen(1);return s}
function passAt(T){if(T<DA)return 0;var c=plen(1)+plen(2),x=T-DA,k=Math.floor(x/c),r=x-k*c;return 1+2*k+(r>=plen(1)?1:0)}

/* flight cards (the 24 clips that float up into the disc) */
var FL=[];
(function(){var r=rng(5),un=0,tw=[0,1,2,3,4,5,-1,-1,-1,-1,6,7];
  for(var k=0;k<12;k++){var sc=tw[k];FL.push({kind:sc>=0?'s':'u',i:sc>=0?sc:un++,t0:44.6+.45*k,d:2.6,xs:34+292*(k/11),ys:466,ss:.42,dir:k%2?1:-1})}
  var lv={15:8,18:9,22:10};
  for(var h=13;h<=24;h++){if(lv[h]!=null)FL.push({kind:'s',i:lv[h],t0:HOURT[h]+2.3,d:1.8,xs:180,ys:CARD.y+CARD.h/2,ss:1,dir:(h%2?1:-1),live:1});
    else FL.push({kind:'u',i:un++,t0:HOURT[h]+.1,d:2.4,xs:30+r()*300,ys:470,ss:.3,dir:r()<.5?-1:1})}
})();
var ENDP={x:180,y:62};
function flightPos(c,t){var p=clamp((t-c.t0)/c.d,0,1),q=.3*p+.7*(p*p*(3-2*p));
  var cx=lerp(c.xs,ENDP.x,.5)+c.dir*70,cy=300;
  var x=(1-q)*(1-q)*c.xs+2*(1-q)*q*cx+q*q*ENDP.x, y=(1-q)*(1-q)*c.ys+2*(1-q)*q*cy+q*q*ENDP.y;
  var sc=lerp(c.ss,.075,Math.pow(q,.8)), pop=c.live?1:eout(seg(t-c.t0,0,.35));
  return {x:x,y:y,s:sc*pop,a:(1-seg(p,.86,1)),rot:Math.sin(q*6.28*(c.dir))*.35*(1-q),p:p,q:q}}
function arrived(t){var n=0;for(var i=0;i<FL.length;i++)if(t>=FL[i].t0+FL[i].d)n++;return n}

/* ---------- layout ---------- */
function resize(){dpr=Math.min(window.devicePixelRatio||1,2);W=cv.width=Math.round(innerWidth*dpr);H=cv.height=Math.round(innerHeight*dpr);
  S=Math.min(W/SW,H/SH);OX=(W-SW*S)/2;OY=(H-SH*S)/2;X0=-OX/S;X1=SW+OX/S;Y0=-OY/S;Y1=SH+OY/S;GY=Y1;
  var m=document.getElementById('mute');document.documentElement.style.setProperty('--mw',m.offsetWidth+'px');}

/* ---------- sprites, grain ---------- */
function sprite(c){var s=document.createElement('canvas');s.width=s.height=64;var x=s.getContext('2d'),gr=x.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,'rgba('+c+',1)');gr.addColorStop(.25,'rgba('+c+',.55)');gr.addColorStop(.6,'rgba('+c+',.13)');gr.addColorStop(1,'rgba('+c+',0)');x.fillStyle=gr;x.fillRect(0,0,64,64);return s}
var SPR={warm:sprite('255,214,140'),pink:sprite('255,100,200'),white:sprite('255,255,255'),cyan:sprite('110,225,255'),orange:sprite('255,150,70')};
var SPRL=[SPR.warm,SPR.warm,SPR.white,SPR.pink,SPR.cyan,SPR.orange];
var grainC=document.createElement('canvas');grainC.width=grainC.height=160;
(function(){var x=grainC.getContext('2d'),im=x.createImageData(160,160),r=rng(99);for(var i=0;i<im.data.length;i+=4){var v=r()*255|0;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255}x.putImageData(im,0,0)})();
function glow(x,y,r,spr,a){g.globalAlpha=a;g.drawImage(spr,x-r,y-r,r*2,r*2)}

/* ---------- world objects ---------- */
var rs=rng(1234),STARS=[],BLD=[],PART=[],MOTE=[],WALK=[];
for(var i=0;i<140;i++)STARS.push({x:-700+rs()*1760,y:-200+rs()*620,s:.5+rs()*1.3,p:rs()*6.28,k:rs()});
(function(){var x=-820;while(x<1180){var w=16+rs()*30,h=40+rs()*76,cols=Math.max(2,Math.floor((w-4)/6)),rows=Math.max(2,Math.floor((h-6)/8)),wins=[];
  for(var q=0;q<cols*rows;q++)wins.push(rs());
  BLD.push({x:x,w:w,h:h,cols:cols,rows:rows,wins:wins,tone:rs()});x+=w+rs()*3}})();
var NPART=reduce?200:520;
for(var i=0;i<NPART;i++){var b=BLD[(rs()*BLD.length)|0];PART.push({x:b.x+rs()*b.w+(rs()-.5)*10,t0:49+Math.pow(rs(),1.2)*26,vy:34+rs()*84,r:.9+rs()*2.8,sp:SPRL[(rs()*SPRL.length)|0],ph:rs()*6.28,am:2+rs()*10,tw:2+rs()*4})}
for(var i=0;i<60;i++)MOTE.push({x:-300+rs()*960,y:rs()*640,v:3+rs()*8,p:rs()*6.28,r:1+rs()*2});
for(var i=0;i<11;i++)WALK.push({x0:rs()*520,v:(rs()<.5?-1:1)*(8+rs()*10),h:20+rs()*9,c:rs()});

/* ---------- sky ---------- */
var SKY=[[0,[8,8,36],[52,40,118]],[11,[10,10,42],[44,36,110]],[39,[12,8,38],[60,30,104]],[44,[16,8,40],[64,24,92]],[56,[20,12,64],[96,34,112]],[66,[34,18,90],[176,56,132]],[74,[56,36,124],[255,118,112]],[78,[76,64,152],[255,172,112]],[84,[100,88,174],[255,204,134]],[90,[62,50,132],[255,172,122]],[94.5,[6,8,28],[30,36,88]]];
var SKYB=[[0,[88,92,168],[255,178,160]],[11,[84,92,170],[255,186,164]],[39,[86,96,176],[255,196,170]],[52,[96,110,190],[255,204,160]],[66,[120,140,210],[255,208,150]],[74,[150,170,226],[255,220,160]],[78,[150,190,240],[255,230,176]],[84,[130,190,245],[255,236,190]],[90,[120,170,235],[255,222,176]],[94.5,[40,40,90],[120,80,110]]];
function skyAt(t){var TB=VAR?SKYB:SKY,i=0;while(i<TB.length-2&&t>TB[i+1][0])i++;var a=TB[i],b=TB[i+1],k;
  k=clamp((t-a[0])/(b[0]-a[0]),0,1);k=k*k*(3-2*k);return {top:mix(a[1],b[1],k),bot:mix(a[2],b[2],k)}}

/* ---------- text helpers ---------- */
function font(sz,w,fam){g.font=(w||400)+' '+sz+'px '+(fam||SANS)}
function ctext(s,x,y,sz,w,col,al,fam){font(sz,w,fam);g.textAlign=al||'center';g.textBaseline='middle';g.fillStyle=col;g.fillText(s,x,y)}
function outlined(s,x,y,sz,w,col,al,fam,oc){font(sz,w,fam);g.textAlign=al||'center';g.textBaseline='middle';g.lineJoin='round';g.lineWidth=Math.max(3,sz*.2);g.strokeStyle=oc||'rgba(8,8,36,.7)';g.strokeText(s,x,y);g.fillStyle=col;g.fillText(s,x,y)}
function rrp(x,y,w,h,r){r=Math.min(r,w/2,h/2);g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function glass(x,y,w,h,r,a,tint){rrp(x,y,w,h,r);var gr=g.createLinearGradient(0,y,0,y+h);gr.addColorStop(0,'rgba(255,255,255,'+(.24*a)+')');gr.addColorStop(1,'rgba(255,255,255,'+(.06*a)+')');
  g.fillStyle='rgba(12,10,48,'+(.62*a)+')';g.fill();g.fillStyle=gr;g.fill();g.lineWidth=1.2;g.strokeStyle=tint?tint:'rgba(255,255,255,'+(.42*a)+')';g.stroke()}

/* ---------- sky / world ---------- */
function drawSky(t){
  var sk=skyAt(t),bot=sk.bot,top=sk.top;
  var gy=H;
  g.setTransform(1,0,0,1,0,0);
  var gr=g.createLinearGradient(0,0,0,gy);gr.addColorStop(0,rgb(top));gr.addColorStop(.62,rgb(mix(top,bot,.55)));gr.addColorStop(1,rgb(bot));
  g.fillStyle=gr;g.fillRect(0,0,W,H);
  if(gy<H){g.fillStyle=rgb(mix([4,5,20],bot,.18));g.fillRect(0,gy-1,W,H-gy+1)}
  g.setTransform(S,0,0,S,OX,OY);
  var dy=seg(t,74,84)*(1-seg(t,88,93));g.globalCompositeOperation='lighter';if(VAR){glow(180,GY-30,380,SPR.orange,.3*(1-dy));glow(300,50,260,SPR.warm,.18*(1-dy))}else{glow(180,GY-30,360,SPR.pink,.2*(1-dy));glow(40,60,260,SPR.cyan,.07*(1-dy))}g.globalCompositeOperation='source-over';g.globalAlpha=1;
  return {bot:bot,top:top}}
function drawStars(t){var a=(1-seg(t,71,84))*(VAR?.3:1);if(a<=0)return;g.globalCompositeOperation='lighter';
  for(var i=0;i<STARS.length;i++){var s=STARS[i];if(s.x<X0-5||s.x>X1+5)continue;var tw=.55+.45*Math.sin(t*(.8+s.k*1.6)+s.p);var y=s.y;if(y>440)continue;
    g.globalAlpha=a*tw*(s.k>.8?.9:.55)*(1-y/520);g.fillStyle='#fff';var r=s.s*(s.k>.9?1.3:.8);g.fillRect(s.x-r/2,y-r/2,r,r)}
  g.globalAlpha=1;g.globalCompositeOperation='source-over'}
function drawMotes(t){g.globalCompositeOperation='lighter';var a=.5*seg(t,0,2)*(1-seg(t,76,84));
  for(var i=0;i<MOTE.length;i++){var m=MOTE[i],y=((m.y-t*m.v)%700+700)%700-30,x=m.x+Math.sin(t*.4+m.p)*8;if(x<X0-10||x>X1+10)continue;
    g.globalAlpha=a*(.25+.25*Math.sin(t*1.2+m.p));g.fillStyle=VAR?'#fff2d6':'#cfd2ff';g.fillRect(x,y,m.r,m.r)}
  g.globalAlpha=1;g.globalCompositeOperation='source-over'}

function windowFrac(t){return VAR?.3+.22*seg(t,3,7)+.46*seg(t,52,70):.12+.42*seg(t,3,7)+.46*seg(t,52,70)}
function drawCity(t,sk){
  var day=seg(t,74,84)*(1-seg(t,88,93)),bc=mix(VAR?[56,50,100]:[10,12,34],VAR?[96,82,126]:[44,30,74],day),by=GY;
  var wf=windowFrac(t),flick=(t<8&&!VAR)?1:0;g.globalAlpha=1;g.fillStyle=rgb(mix(bc,[0,0,0],.35));g.fillRect(X0,by-.5,X1-X0,Y1-by+3);
  // buildings
  for(var i=0;i<BLD.length;i++){var b=BLD[i];if(b.x>X1+4||b.x+b.w<X0-4)continue;
    var tn=b.tone*10;g.fillStyle=rgb([bc[0]+tn,bc[1]+tn,bc[2]+tn*1.4]);g.fillRect(b.x,by-b.h,b.w,b.h)}
  // rim light at dawn
  if(day>.02){g.fillStyle='rgba(255,170,120,'+.5*day+')';for(var i=0;i<BLD.length;i++){var b=BLD[i];if(b.x>X1||b.x+b.w<X0)continue;g.fillRect(b.x,by-b.h,b.w,1.2)}}
  // windows
  var warm=mix([255,214,130],VAR?[255,196,140]:[255,160,190],seg(t,60,76)),wa=.5+.5*seg(t,52,70);
  g.fillStyle=rgb(warm,.85*Math.min(1,wa));
  for(var i=0;i<BLD.length;i++){var b=BLD[i];if(b.x>X1||b.x+b.w<X0)continue;
    for(var c=0;c<b.cols;c++)for(var r=0;r<b.rows;r++){var v=b.wins[r*b.cols+c];
      var on=v<wf; if(flick&&t<3.6&&t>3&&v<.6){on=((Math.floor(t*10)+i+c)%3)!==0}
      if(on)g.fillRect(b.x+3+c*6,by-b.h+4+r*8,3.4,4.4)}}
  g.globalAlpha=1;
  // little walkers on the street (everyone going about the day)
  var wa2=seg(t,4.2,6.5)*(1-seg(t,73,78))*.9;if(wa2>0){var WC=['#ff8fb8','#7fd8ff','#ffd27a','#b9a2ff','#8cf0c0'];g.lineCap='round';
    for(var i=0;i<WALK.length;i++){var w=WALK[i],x=(((w.x0+t*w.v)%520)+520)%520-80,ph=t*(3.5+w.c*2)+i,bob=Math.abs(Math.sin(ph))*1.4,h=w.h,y0=GY-3,cc=WC[i%5];
      g.globalAlpha=wa2*.5;g.strokeStyle=cc;g.lineWidth=2.4;var sw=Math.sin(ph)*3.2;

function tone(w,fr,a,d,peak,type,fe){var o=AC.createOscillator();o.type=type||'sine';o.frequency.setValueAtTime(fr,w);if(fe)o.frequency.exponentialRampToValueAtTime(fe,w+a+d);var gn=env(w,0,a,d,peak);o.connect(gn);o.start(w);o.stop(w+a+d+.05)}
function noise(w,a,d,peak,f0,f1,type,q){var s=AC.createBufferSource();s.buffer=nbuf;s.loop=true;var fl=AC.createBiquadFilter();fl.type=type||'bandpass';fl.Q.value=q||.8;fl.frequency.setValueAtTime(f0,w);fl.frequency.exponentialRampToValueAtTime(f1,w+a+d);var gn=env(w,0,a,d,peak);s.connect(fl);fl.connect(gn);s.start(w,Math.random()*1.5);s.stop(w+a+d+.05)}
function bell(w,fr,pk,d){tone(w,fr,.004,d||1.1,pk,'sine');tone(w,fr*2.01,.003,(d||1.1)*.5,pk*.35,'sine');tone(w,fr*3.99,.003,.25,pk*.12,'sine')}
function dset(w,vol,fq,tc){if(!drone)return;drone.g.gain.setTargetAtTime(vol,w,tc||1.2);var m=fq/55;[55,55.6,110.2].forEach(function(b,i){drone.o[i].frequency.setTargetAtTime(b*m,w,tc||1.5)});drone.f.frequency.setTargetAtTime(220+fq*3.2,w,tc||1.5)}
/* music-box / marimba timbre for the second world: soft sine + 4th partial, short decay */
function mbox(w,fr,pk,d){tone(w,fr,.004,d||.9,pk,'sine');tone(w,fr*4,.002,.18,pk*.22,'sine');tone(w,fr*2,.003,(d||.9)*.5,pk*.25,'triangle')}
function dsetB(w,vol,fq,tc){dset(w,vol,fq*1.335,tc)} /* D drone instead of A */
var MELB=[587.3,740,880,987.8,880,740,659.3,740,880,987.8,1318.5,1174.7];
var PENT=[587.3,659.3,740,880,987.8,1174.7,1318.5];
function lst(){var L=[];L.dt=[];return L}
/* ---- pass A events (story time ta, shifted by off) ---- */
function buildA(off,card){
  var L=lst();
  function EVT(t,fn){L.push({t:t+off,fn:fn})}
  function DT(t,vol,fq){L.dt.push([t+off,vol,fq])}
  if(card){EVT(.3,function(w){[523.3,659.3,784,1046.5].forEach(function(f,i){bell(w+i*.16,f,.08,1.6)});tone(w,130.8,.3,2.4,.07,'sine')})}
  EVT(.02,function(w){dset(w,.0,55,.01)});DT(.02,0,55);
  EVT(.25,function(w){tone(w,95,.01,1.9,.5,'sine',34);noise(w,.02,1.4,.16,3000,150,'lowpass',.6);dset(w,.15,55,.8)});DT(.25,.15,55);
  for(var i=0;i<22;i++)(function(i){EVT(.95+i*.1,function(w){tone(w,2100+(i%5)*120,.002,.03,.018,'triangle')})})(i);
  EVT(3.0,function(w){tone(w,880,.004,.35,.05,'sine');tone(w,1318,.004,.3,.035,'sine')});
  /* the disc's whispered request: a tiny question-mark sound */
  EVT(3.0,function(w){tone(w,1046.5,.01,.5,.03,'sine',1318)});
  EVT(4.2,function(w){noise(w,1.1,.9,.2,180,3200,'bandpass',.9);dset(w,.19,62,1)});DT(4.2,.19,62);
  EVT(8.2,function(w){tone(w,1760,.004,.12,.05,'sine')});
  BLK.forEach(function(b){EVT(b.t,function(w){tone(w,1320,.003,.09,.085,'square');noise(w+.05,.002,.08,.04,3000,6000,'highpass')})});
  [30.9,31.2,31.5,31.8].forEach(function(x){EVT(x,function(w){tone(w,1320,.003,.09,.07,'square')})});
  EVT(11,function(w){dset(w,.17,60,2)});DT(11,.17,60);EVT(32,function(w){dset(w,.19,66,2)});DT(32,.19,66);
  EVT(39.5,function(w){noise(w,.002,.5,.3,6000,400,'highpass',.5);tone(w,70,.003,.9,.5,'sine',30);for(var i=0;i<7;i++)tone(w+.03+i*.045,2600+Math.random()*3200,.002,.25,.05,'sine');dset(w,.22,70,.5)});DT(39.5,.22,70);
  EVT(41,function(w){dset(w,.2,76,2)});DT(41,.2,76);
  /* "it did not come to destroy" - a warm, soft major chord opens up after the crack */
  EVT(44.2,function(w){[261.6,329.6,392,523.3].forEach(function(f,i){tone(w+i*.09,f,.5,3.2,.045,'sine')})});
  for(var k=0;k<12;k++)(function(k){EVT(44.6+.45*k,function(w){noise(w,.12,.5,.07,500+k*60,2800,'bandpass',1.2);tone(w,700+k*70,.01,.2,.03,'triangle',1400+k*90)})})(k);
  EVT(44.3,function(w){dset(w,.2,82,1.5)});DT(44.3,.2,82);
  /* the seed: a soft pulse each time a clip arrives is carried by the bells below */
  EVT(47.6,function(w){tone(w,196,.3,1.6,.05,'sine');tone(w,293.7,.3,1.4,.03,'sine')});
  for(var h=13;h<=24;h++)(function(h){EVT(HOURT[h],function(w){var pk=h>=21?.19:.14;bell(w,MEL[h-13],pk,h>=22?1.6:1.1);if(h==24)bell(w,MEL[11]/2,.1,2.2)})})(h);
  EVT(52,function(w){dset(w,.22,92,1.5)});DT(52,.22,92);EVT(66,function(w){dset(w,.26,110,2)});DT(66,.26,110);EVT(73.6,function(w){noise(w,2.4,1.2,.2,300,5000,'bandpass',.7);dset(w,.3,138,1.5)});DT(73.6,.3,138);
  EVT(76.6,function(w){dset(w,0,138,.25);try{drone.f.frequency.setTargetAtTime(120,w,.2)}catch(e){}});DT(76.6,0,138);
  EVT(81,function(w){[130.8,261.6,329.6,392,493.9,587.3].forEach(function(f,i){tone(w+i*.07,f,.6,5.6,i==0?.13:.07,'sine')});tone(w,65.4,.4,6,.16,'sine');noise(w,.5,2,.03,2000,6000,'bandpass',2)});
  for(var i=0;i<24;i++)(function(i){EVT(90.2+i*.058,function(w){tone(w,2400-i*60,.001,.025,.035,'square')})})(i);
  EVT(91.6,function(w){tone(w,523.3,.004,.5,.08,'sine');tone(w,784,.004,.5,.06,'sine')});
  EVT(92.5,function(w){dset(w,.0,55,.4)});DT(92.5,0,55);
  L.sort(function(a,b){return a.t-b.t});return L}
/* ---- pass B events: D-major pentatonic, music-box timbre, soft pad, no square beeps ---- */
function buildB(off){
  var L=lst();
  function EB(ta,fn){L.push({t:off+tlOf(ta),fn:fn})}
  function DB_(ta,vol,fq){L.dt.push([off+tlOf(ta),vol,fq])}
  L.push({t:.3,fn:function(w){[587.3,740,880,1174.7].forEach(function(f,i){mbox(w+i*.16,f,.09,1.5)});[146.8,220,293.7].forEach(function(f,i){tone(w+i*.1,f,.5,2.6,.05,'sine')})}});
  EB(.02,function(w){dsetB(w,.0,55,.01)});DB_(.02,0,55);
  EB(.25,function(w){tone(w,146.8,.05,2.2,.16,'sine');noise(w,.3,1.2,.05,400,3000,'bandpass',.6);mbox(w,1174.7,.07,1.6);dsetB(w,.1,55,.8)});DB_(.25,.1,55);
  for(var i=0;i<12;i++)(function(i){EB(.95+i*.2,function(w){mbox(w,PENT[(i*2)%7]*1.0,.025,.5)})})(i);
  EB(4.2,function(w){noise(w,1.4,.9,.08,200,2400,'bandpass',.7);dsetB(w,.13,62,1)});DB_(4.2,.13,62);
  EB(8.2,function(w){mbox(w,1760,.05,.8)});
  var BN=[587.3,740,880,740,987.8,880,740,659.3];
  BLK.forEach(function(b,i){EB(b.t,function(w){mbox(w,BN[i],.09,.9);mbox(w+.12,BN[i]*1.5,.04,.6)})});
  EB(11,function(w){dsetB(w,.12,60,2)});DB_(11,.12,60);EB(32,function(w){dsetB(w,.14,66,2)});DB_(32,.14,66);
  EB(39.5,function(w){[293.7,370,440,587.3].forEach(function(f,i){tone(w+i*.1,f,.4,3,.05,'sine')});noise(w,.6,1.2,.05,500,5000,'bandpass',.8);dsetB(w,.16,70,.8)});DB_(39.5,.16,70);
  for(var k=0;k<12;k++)(function(k){EB(44.6+.45*k,function(w){mbox(w,PENT[k%7]*(k>6?1.5:1),.035,.6);noise(w,.1,.4,.035,600+k*70,3000,'bandpass',1.2)})})(k);
  EB(44.3,function(w){dsetB(w,.15,82,1.5)});DB_(44.3,.15,82);
  for(var h=13;h<=24;h++)(function(h){EB(HOURT[h],function(w){var pk=h>=21?.17:.12;mbox(w,MELB[h-13]*(h<20?1:1),pk,h>=22?1.7:1.2);if(h==24)mbox(w,MELB[11]/2,.1,2.4)})})(h);
  EB(52,function(w){dsetB(w,.16,92,1.5)});DB_(52,.16,92);EB(66,function(w){dsetB(w,.2,110,2)});DB_(66,.2,110);
  EB(73.6,function(w){noise(w,2.4,1.2,.1,300,4500,'bandpass',.7);dsetB(w,.2,138,1.5)});DB_(73.6,.2,138);
  EB(76.6,function(w){dsetB(w,0,138,.25);try{drone.f.frequency.setTargetAtTime(120,w,.2)}catch(e){}});DB_(76.6,0,138);
  EB(81,function(w){[146.8,293.7,370,440,554.4,659.3].forEach(function(f,i){tone(w+i*.08,f,.7,5.6,i==0?.13:.06,'sine')});tone(w,73.4,.4,6,.15,'sine');noise(w,.5,2,.025,2000,6000,'bandpass',2)});
  for(var i=0;i<24;i++)(function(i){EB(90.2+i*.058,function(w){tone(w,1500+i*40,.002,.05,.025,'sine')})})(i);
  EB(91.6,function(w){mbox(w,587.3,.09,1.2);mbox(w+.08,880,.07,1.2);mbox(w+.16,1174.7,.06,1.4)});
  EB(92.5,function(w){dsetB(w,.0,55,.4)});DB_(92.5,0,55);
  L.sort(function(a,b){return a.t-b.t});return L}
var LA0=buildA(0,false),LB=buildB(CARDLEN),LA2=buildA(CARDLEN,true);
function lstOf(p){return p==0?LA0:(p%2?LB:LA2)}
function audioSeek(T){
  if(!audioOK)return;newBus();var p=passAt(T),loc=T-pstart(p),L=lstOf(p);ePass=p;eIdx=L.length;
  for(var i=0;i<L.length;i++)if(L[i].t>=loc-.02){eIdx=i;break}
  var w=AC.currentTime,vol=0,fq=55,vb=p%2==1,ds=L.dt.slice().sort(function(a,b){return a[0]-b[0]});
  for(var i=0;i<ds.length;i++)if(ds[i][0]<=loc){vol=ds[i][1];fq=ds[i][2]}
  if(vb)dsetB(w,vol,fq,.05);else dset(w,vol,fq,.05)}
function audioTick(T){
  if(!audioOK||!AC||AC.state!=='running')return;
  for(var n=0;n<200;n++){var L=lstOf(ePass);if(eIdx>=L.length){ePass++;eIdx=0;continue}var ev=L[eIdx],X=pstart(ePass)+ev.t;if(X>T+1.2)break;
    if(X>=T-.05){try{ev.fn(AC.currentTime+Math.max(0,X-T)+.01)}catch(e){}}
    eIdx++}}
function setMuted(m){muted=m;if(master)master.gain.setTargetAtTime(m?0:.85,AC.currentTime,.03)}

/* ---------- main: single clock, gate, controls ---------- */
var T=0,running=false,started=false,userPaused=false,lastNow=0,lastCap=-2;
var gate=document.getElementById('gate'),btnMute=document.getElementById('mute'),btnRe=document.getElementById('replay'),live=document.getElementById('live');
function updMuteBtn(){btnMute.textContent=muted?'♪ 音なし':'♪ 音あり';btnMute.setAttribute('aria-pressed',muted?'true':'false');btnMute.setAttribute('aria-label',muted?'音を出す':'音を消す');resize()}
function frame(now){
  requestAnimationFrame(frame);
  var dt=Math.min(.1,Math.max(0,(now-lastNow)/1000));lastNow=now;
  if(running){T+=dt;audioTick(T)}
  if(running||dirty){render(T);dirty=false;
    var ix=CARDPH?-9:activeCap(TL);if(ix!==lastCap){lastCap=ix;live.textContent=ix==-9?(VAR?'2周目 — 新しい世界':'3周目 — はじまりの一日'):(ix>=0?CL[ix].plain:'')}}
}
var dirty=true;
function seek(x){T=Math.max(0,x);dirty=true;audioSeek(T);render(T);dirty=false}
window.__seek=function(x){T=x;dirty=true;render(T);dirty=false;return T};
window.__state=function(){return {T:T,running:running,pass:passAt(T),var:VAR,card:CARDPH,tl:TL,muted:muted,audio:audioOK,capBox:capBox,DUR:DUR,DA:DA,DB:DB,CARDLEN:CARDLEN,pstart:[0,1,2,3,4].map(pstart),S:S,OX:OX,OY:OY}};
function start(sound){
  if(started)return;started=true;muted=!sound;
  if(initAudio()){try{AC.resume()}catch(e){}}
  gate.classList.add('hide');btnMute.classList.add('show');btnRe.classList.add('show');updMuteBtn();
  T=0;running=true;userPaused=false;lastNow=performance.now();audioSeek(T);
}
document.getElementById('goSound').addEventListener('click',function(){start(true)});
document.getElementById('goMute').addEventListener('click',function(){start(false)});
btnMute.addEventListener('click',function(){
  if(!audioOK){if(initAudio()){try{AC.resume()}catch(e){}audioSeek(T)}}
  setMuted(!muted);if(!audioOK)muted=!muted?muted:muted;updMuteBtn()});
btnRe.addEventListener('click',function(){if(!started)return;T=0;running=true;userPaused=false;if(AC&&AC.state==='suspended')try{AC.resume()}catch(e){};audioSeek(T);dirty=true;lastCap=-2});
cv.addEventListener('click',function(){if(!started)return;userPaused=!userPaused;running=!userPaused;if(AC){try{userPaused?AC.suspend():AC.resume()}catch(e){}}});
document.addEventListener('visibilitychange',function(){if(!started)return;if(document.hidden){running=false;if(AC)try{AC.suspend()}catch(e){}}else if(!userPaused){running=true;lastNow=performance.now();if(AC)try{AC.resume()}catch(e){}}});
window.addEventListener('resize',function(){resize();scanPat=null;dirty=true});
resize();updMuteBtn();
var qt=params.get('t'),qp=params.get('pass');
if(qt!==null||params.has('frame')){var x=parseFloat(qt)||0;if(qp){var pn=parseInt(qp)||1;if(pn>1)x=pstart(pn-1)+CARDLEN+x}started=true;gate.style.display='none';btnMute.classList.add('show');btnRe.classList.add('show');T=x;running=false;userPaused=true;dirty=true}
else{T=3.7;if(qp){var pn2=parseInt(qp)||1;if(pn2>1)T=pstart(pn2-1)+CARDLEN+3.7}dirty=true}
requestAnimationFrame(function(n){lastNow=n;frame(n)});

})();
